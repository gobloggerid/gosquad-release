loadmodule /usr/lib/redis/modules/redisearch.so

supervised systemd
daemonize no

port 0
unixsocket /run/redis/redis.sock
unixsocketperm 770
protected-mode yes

save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename gosquad.rdb
dir /var/lib/redis

aclfile /etc/redis/gosquad.acl

maxmemory 512mb
maxmemory-policy allkeys-lru

timeout 0
loglevel notice
